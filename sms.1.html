<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management System</h1>
        </header>

        <section class="student-form">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="input-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter Student ID">
                </div>

                <div class="input-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter Student Name">
                </div>

                <div class="input-group">
                    <label for="studentAge">Age</label>
                    <input type="number" id="studentAge" placeholder="Enter Age">
                </div>

                <div class="input-group">
                    <label for="studentCourse">Course</label>
                    <input type="text" id="studentCourse" placeholder="Enter Course">
                </div>

                <div class="input-group">
                    <label for="studentEmail">Email</label>
                    <input type="email" id="studentEmail" placeholder="Enter Email">
                </div>

                <div class="button-group">
                    <button type="submit" id="addBtn">Add Student</button>
                    <button type="button" id="updateBtn">Update Student</button>
                    <button type="reset">Clear</button>
                </div>

            </form>

        </section>
        <section class="search-section">

            <h2>Search Student</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by Name or ID">

        </section>

        <section class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Total Courses</h3>
                <p id="totalCourses">0</p>
            </div>

        </section>

        <section class="student-list">

            <h2>Student List</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="studentTableBody">

                    <!-- JavaScript will add rows here -->

                </tbody>

            </table>

        </section>

    </div>

</body>
</html>
