<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="sms.2.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">

        <h2>SMS</h2>
        <button id="logoutBtn">Logout</button>

        <button id="dashboardBtn">Dashboard</button>

        <button id="addStudentBtn">Add Student</button>

        <button id="updateStudentBtn">Update Student</button>

        <button id="searchStudentBtn">Search Student</button>

        <button id="deleteStudentBtn">Delete Student</button>

        <button id="studentListBtn">Student List</button>

    </aside>

    <main class="content">
        <section id="dashboardSection">

            <h1>Student Management System</h1>

            <div class="cards">

                <div class="card">
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>

                <div class="card">
                    <h3>Total Courses</h3>
                    <p id="totalCourses">0</p>
                </div>

            </div>

        </section>
        <section id="addSection" class="hide">

            <h2>Add Student</h2>

            <form id="addForm">

                <input type="text" id="studentId" placeholder="Student ID">

                <input type="text" id="studentName" placeholder="Student Name">

                <input type="number" id="studentAge" placeholder="Age">

                <input type="text" id="studentCourse" placeholder="Course">

                <input type="email" id="studentEmail" placeholder="Email">

                <button type="submit">Save Student</button>

            </form>

        </section>

        <section id="updateSection" class="hide">

            <h2>Update Student</h2>

            <input type="text" id="updateId" placeholder="Enter Student ID">

            <button id="findStudent">Find Student</button>

            <form id="updateForm">

                <input type="text" id="updateNewId" placeholder="New Student ID">

                <input type="text" id="updateName" placeholder="Student Name">

                <input type="number" id="updateAge" placeholder="Age">

                <input type="text" id="updateCourse" placeholder="Course">

                <input type="email" id="updateEmail" placeholder="Email">

                <button type="submit">Update Student</button>

            </form>

        </section>

        <section id="searchSection" class="hide">

            <h2>Search Student</h2>

            <input type="text"
                   id="searchInput"
                   placeholder="Search by ID or Name">

            <div id="searchResult"></div>

        </section>

        <section id="deleteSection" class="hide">

            <h2>Delete Student</h2>

            <input type="text"
                   id="deleteId"
                   placeholder="Enter Student ID">

            <button id="deleteBtn">Delete</button>

        </section>
        <section id="listSection" class="hide">

            <h2>Student List</h2>

            <div class="table-wrapper">
                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Age</th>

                            <th>Course</th>

                            <th>Email</th>

                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>
            </div>

        </section>

    </main>

</div>

<script src="sms.3.js"></script>

</body>
</html>
